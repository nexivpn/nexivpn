<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexiVPN — скоро</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
    color: #e0e0ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .glow {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    pointer-events: none;
  }
  .glow-1 { background: #7b2fff; top: -100px; left: -100px; }
  .glow-2 { background: #00d4ff; bottom: -100px; right: -100px; }
  .card {
    position: relative;
    background: rgba(20, 20, 40, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(123, 47, 255, 0.3);
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(123, 47, 255, 0.2);
  }
  .logo {
    font-size: 48px;
    margin-bottom: 16px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #7b2fff, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 16px;
    color: #8888aa;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    background: rgba(123, 47, 255, 0.15);
    border: 1px solid rgba(123, 47, 255, 0.4);
    color: #b088ff;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    margin-bottom: 28px;
  }
  .features {
    text-align: left;
    margin-bottom: 32px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    font-size: 15px;
    color: #c0c0e0;
  }
  .feature .dot {
    width: 8px; height: 8px;
    background: linear-gradient(90deg, #7b2fff, #00d4ff);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(123, 47, 255, 0.6);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(90deg, #7b2fff, #00d4ff);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(123, 47, 255, 0.5);
  }
  .btn:active { transform: translateY(0); }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #555577;
  }
  .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    background: #00ff88;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="card">
    <div class="logo">🛡️</div>
    <h1>NexiVPN</h1>
    <div class="badge"><span class="pulse"></span>в разработке</div>
    <p class="subtitle">Быстрый и простой VPN.<br>Скоро откроемся — следи за обновлениями.</p>

    <div class="features">
      <div class="feature"><span class="dot"></span>Шифрование трафика</div>
      <div class="feature"><span class="dot"></span>Без логов и слежки</div>
      <div class="feature"><span class="dot"></span>Работает на телефоне и ПК</div>
      <div class="feature"><span class="dot"></span>Один клик — и ты в сети</div>
    </div>

    <a href="https://t.me/" class="btn" id="cta">Узнать о запуске</a>

    <div class="footer">© 2026 NexiVPN · сделано своими руками</div>
  </div>

<script>
  document.getElementById('cta').addEventListener('click', function(e) {
    e.preventDefault();
    this.textContent = '✓ Спасибо! Скоро напишем';
    this.style.background = 'linear-gradient(90deg, #00ff88, #00d4ff)';
    setTimeout(() => {
      this.textContent = 'Узнать о запуске';
      this.style.background = 'linear-gradient(90deg, #7b2fff, #00d4ff)';
    }, 2500);
  });
</script>
</body>
  </html>
